name: Daily Free Zoom Chatbot

on:
  schedule:
    # Daily 07:18 AM IST = 05:15 AM UTC
    - cron: '15 5 * * *'
  workflow_dispatch: # Manual test button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Script
        env:
          ZOOM_JOIN_URL: ${{ secrets.ZOOM_JOIN_URL }}
        run: python zoom_bot.py
